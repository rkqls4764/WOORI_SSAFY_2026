weight="400" fill="#5B6B82" font-family="Noto Sans CJK KR, sans-serif">주황 = 고객 · 파랑 = AI · 초록 = 시스템 · 빨강 = 통제(가드·승인) · 점선 = 운영 전환 시 교체되는 연동 자리</text><text x="205" y="738" text-anchor="start" font-size="15" font-weight="400" fill="#5B6B82" font-family="Noto Sans CJK KR, sans-serif">LLM은 숫자를 계산하지 않고 실행하지 않음 · 계산과 판정은 시스템 도구 · 실행은 고객 승인 토큰을 검증한 뒤 시스템이 수행</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>