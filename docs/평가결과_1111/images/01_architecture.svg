t="92" rx="12" fill="#E6F6EE" stroke="#1F9D63" stroke-width="2"/><text x="360.0" y="514.0" text-anchor="middle" font-size="21" font-weight="700" fill="#0E3B26" font-family="Noto Sans CJK KR, sans-serif">마이데이터 거래내역</text><text x="360.0" y="541.0" text-anchor="middle" font-size="16" fill="#0E3B26" font-family="Noto Sans CJK KR, sans-serif">6개월 · 가상 412건</text><rect x="585" y="474.0" width="310" height="92" rx="12" fill="#E6F6EE" stroke="#1F9D63" stroke-width="2"/><text x="740.0" y="514.0" text-anchor="middle" font-size="21" font-weight="700" fill="#0E3B26" font-family="Noto Sans CJK KR, sans-serif">탐지 · 이사 규칙</text><text x="740.0" y="541.0" text-anchor="middle" font-size="16" fill="#0E3B26" font-family="Noto Sans CJK KR, sans-serif">급여 먼저 · 자동송금 D-2 영업일</text><rect x="965" y="474.0" width="310" height="92" rx="12" fill="#F4F6F9" stroke="#8A94A6" stroke-width="2" stroke-dasharray="7 5"/><text x="1120.0" y="514.0" text-anchor="middle" font-size="21" font-weight="700" fill="#2A3140" font-family="Noto Sans CJK KR, sans-serif">기관 어댑터</text><text x="1120.0" y="541.0" text-anchor="middle" font-size="16" fill="#2A3140" font-family="Noto Sans CJK KR, sans-serif">데모: 시뮬레이터 → 운영: 계좌이동서비스</text><rect x="1345" y="474.0" width="310" height="92" rx="12" fill="#F4F6F9" stroke="#8A94A6" stroke-width="2" stroke-dasharray="7 5"/><text x="1500.0" y="514.0" text-anchor="middle" font-size="21" font-weight="700" fill="#2A3140" font-family="Noto Sans CJK KR, sans-serif">인증 어댑터</text><text x="1500.0" y="541.0" text-anchor="middle" font-size="16" fill="#2A3140" font-family="Noto Sans CJK KR, sans-serif">데모: 모의 인증 → 운영: 은행 인증</text><rect x="205" y="612" width="1450" height="64" rx="12" fill="#EEF1F6" stroke="#8A94A6" stroke-width="2"/><text x="930.0" y="652" text-anchor="middle" font-size="17" font-weight="600" fill="#2A3140" font-family="Noto Sans CJK KR, sans-serif">감사 로그 · 고객 요청 · 도구 호출 · 가드 · 승인 · 실행을 해시 체인으로 기록 → 변조 탐지, &#x27;승인 없는 실행 0건&#x27;을 로그만으로 계산</text><path d="M 360.0 131.0 L 360.0