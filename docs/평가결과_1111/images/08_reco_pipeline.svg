 CJK KR, sans-serif">규칙표 · 예: 외식·미식형 → 달보</text><text x="880.0" y="127.0" text-anchor="middle" font-size="16" fill="#0E3B26" font-family="Noto Sans CJK KR, sans-serif">고객이 다른 캐릭터 선택 가능</text><rect x="1090" y="40" width="280" height="104" rx="12" fill="#FFF1E3" stroke="#E07B1A" stroke-width="2"/><text x="1230.0" y="73.0" text-anchor="middle" font-size="21" font-weight="700" fill="#4A2A08" font-family="Noto Sans CJK KR, sans-serif">목표 선택</text><text x="1230.0" y="100.0" text-anchor="middle" font-size="16" fill="#4A2A08" font-family="Noto Sans CJK KR, sans-serif">식비 절약 · 저축</text><text x="1230.0" y="127.0" text-anchor="middle" font-size="16" fill="#4A2A08" font-family="Noto Sans CJK KR, sans-serif">고객이 고름(소비만 보고 단정 안 함)</text><rect x="40" y="270" width="280" height="104" rx="12" fill="#E7F0FF" stroke="#2F6FDB" stroke-width="2"/><text x="180.0" y="303.0" text-anchor="middle" font-size="21" font-weight="700" fill="#11264A" font-family="Noto Sans CJK KR, sans-serif">추천</text><text x="180.0" y="330.0" text-anchor="middle" font-size="16" fill="#11264A" font-family="Noto Sans CJK KR, sans-serif">예금성 상품 · 미션</text><text x="180.0" y="357.0" text-anchor="middle" font-size="16" fill="#11264A" font-family="Noto Sans CJK KR, sans-serif">기대 효과는 시스템 계산</text><rect x="360" y="270" width="280" height="104" rx="12" fill="#FFF1E3" stroke="#E07B1A" stroke-width="2"/><text x="500.0" y="316.0" text-anchor="middle" font-size="21" font-weight="700" fill="#4A2A08" font-family="Noto Sans CJK KR, sans-serif">미션 참여</text><text x="500.0" y="343.0" text-anchor="middle" font-size="16" fill="#4A2A08" font-family="Noto Sans CJK KR, sans-serif">고객 버튼으로만 시작</text><rect x="680" y="270" width="280" height="104" rx="12" fill="#E6F6EE" stroke="#1F9D63" stroke-width="2"/><text x="820.0" y="316.0" text-anchor="middle" font-size="21" font-weight="700" fill="#0E3B26" font-family="Noto Sans CJK KR, sans-serif">달성 판정</text><text x="820.0" y="343.0" text-anchor="middle" font-size="16" fill="#0E3B26" font-family="