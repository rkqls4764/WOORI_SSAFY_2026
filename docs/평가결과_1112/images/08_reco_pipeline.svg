<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="500" viewBox="0 0 1700 500" xmlns:c2pa="http://c2pa.org/manifest"><rect width="100%" height="100%" fill="white"/><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,1 L15,8 L0,15 z" fill="#4A5568"/></marker><marker id="as" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="2" refY="8" orient="auto"><path d="M15,1 L0,8 L15,15 z" fill="#4A5568"/></marker><marker id="r" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,1 L15,8 L0,15 z" fill="#D64545"/></marker><marker id="rs" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="2" refY="8" orient="auto"><path d="M15,1 L0,8 L15,15 z" fill="#D64545"/></marker></defs><rect x="40" y="40" width="300" height="108" rx="12" fill="#FFF1E3" stroke="#E07B1A" stroke-width="2"/><text x="190.0" y="75.0" text-anchor="middle" font-size="21" font-weight="700" fill="#4A2A08" font-family="Noto Sans CJK KR, sans-serif">동의</text><text x="190.0" y="102.0" text-anchor="middle" font-size="16" fill="#4A2A08" font-family="Noto Sans CJK KR, sans-serif">소비 분석에 쓸 거래 범위</text><text x="190.0" y="129.0" text-anchor="middle" font-size="16" fill="#4A2A08" font-family="Noto Sans CJK KR, sans-serif">고객이 버튼으로 동의</text><rect x="400" y="40" width="300" height="108" rx="12" fill="#E6F6EE" stroke="#1F9D63" stroke-width="2"/><text x="550.0" y="75.0" text-anchor="middle" font-size="21" font-weight="700" fill="#0E3B26" font-family="Noto Sans CJK KR, sans-serif">소비 분석</text><text x="550.0" y="102.0" text-anchor="middle" font-size="16" fill="#0E3B26" font-family="Noto Sans CJK KR, sans-serif">최근 90일 카드 지출</text><text x="550.0" y="129.0" text-anchor="middle" font-size="16" fill="#0E3B26" font-family="Noto Sans CJK KR, sans-serif">업종 비중 · 평균 대비 배수</text><rect x="760" y="40" width="320" height="108" rx="12" fill="#E6F6EE" stroke="#1F9D63" stroke-width="2"/><text x="920.0" y="75.0" text-anchor="middle" font-size="21" font-weight="700" fill="#0E3B26" font-family="Noto Sans CJK KR, sans-serif">유형 · 캐릭터 매칭</text><text x="920.0" y="102.0" text-anchor="middle" font-size="16" fill="#0E3B26" font-family="Noto Sans CJK KR, sans-serif">규칙: 평균의 1.5배 이상 + 5%p 이상</text><text x="920.0" y="129.0" text-anchor="middle" font-size="16" fill="#0E3B26" font-family="Noto Sans CJK KR, sans-serif">예: 외식·배달 53% → 달보</text><rect x="1140" y="40" width="330" height="108" rx="12" fill="#E7F0FF" stroke="#2F6FDB" stroke-width="2"/><text x="1305.0" y="75.0" text-anchor="middle" font-size="21" font-weight="700" fill="#11264A" font-family="Noto Sans CJK KR, sans-serif">전담 캐릭터</text><text x="1305.0" y="102.0" text-anchor="middle" font-size="16" fill="#11264A" font-family="Noto Sans CJK KR, sans-serif">말투만 바뀌는 같은 Agent</text><text x="1305.0" y="129.0" text-anchor="middle" font-size="16" fill="#11264A" font-family="Noto Sans CJK KR, sans-serif">이사 대화는 요약 1개로 압축</text><rect x="40" y="290" width="240" height="108" rx="12" fill="#FFF1E3" stroke="#E07B1A" stroke-width="2"/><text x="160.0" y="325.0" text-anchor="middle" font-size="21" font-weight="700" fill="#4A2A08" font-family="Noto Sans CJK KR, sans-serif">목표 선택</text><text x="160.0" y="352.0" text-anchor="middle" font-size="16" fill="#4A2A08" font-family="Noto Sans CJK KR, sans-serif">식비 절약 · 저축</text><text x="160.0" y="379.0" text-anchor="middle" font-size="16" fill="#4A2A08" font-family="Noto Sans CJK KR, sans-serif">고객이 고름</text><rect x="320" y="290" width="280" height="108" rx="12" fill="#E7F0FF" stroke="#2F6FDB" stroke-width="2"/><text x="460.0" y="325.0" text-anchor="middle" font-size="21" font-weight="700" fill="#11264A" font-family="Noto Sans CJK KR, sans-serif">추천</text><text x="460.0" y="352.0" text-anchor="middle" font-size="16" fill="#11264A" font-family="Noto Sans CJK KR, sans-serif">예금성 적금 2종 · 미션</text><text x="460.0" y="379.0" text-anchor="middle" font-size="16" fill="#11264A" font-family="Noto Sans CJK KR, sans-serif">효과는 시스템 계산 · AI는 설명</text><rect x="640" y="290" width="240" height="108" rx="12" fill="#FFF1E3" stroke="#E07B1A" stroke-width="2"/><text x="760.0" y="338.0" text-anchor="middle" font-size="21" font-weight="700" fill="#4A2A08" font-family="Noto Sans CJK KR, sans-serif">미션 참여</text><text x="760.0" y="365.0" text-anchor="middle" font-size="16" fill="#4A2A08" font-family="Noto Sans CJK KR, sans-serif">고객 버튼으로만 시작</text><rect x="920" y="290" width="240" height="108" rx="12" fill="#E6F6EE" stroke="#1F9D63" stroke-width="2"/><text x="1040.0" y="338.0" text-anchor="middle" font-size="21" font-weight="700" fill="#0E3B26" font-family="Noto Sans CJK KR, sans-serif">주간 판정</text><text x="1040.0" y="365.0" text-anchor="middle" font-size="16" fill="#0E3B26" font-family="Noto Sans CJK KR, sans-serif">거래내역 기준 · 시스템</text><rect x="1200" y="290" width="220" height="108" rx="12" fill="#FDECEC" stroke="#D64545" stroke-width="2"/><text x="1310.0" y="338.0" text-anchor="middle" font-size="21" font-weight="700" fill="#4A1010" font-family="Noto Sans CJK KR, sans-serif">꿀머니 원장</text><text x="1310.0" y="365.0" text-anchor="middle" font-size="16" fill="#4A1010" font-family="Noto Sans CJK KR, sans-serif">중복 지급 방지 · 한도</text><rect x="1460" y="290" width="200" height="108" rx="12" fill="#FFF1E3" stroke="#E07B1A" stroke-width="2"/><text x="1560.0" y="338.0" text-anchor="middle" font-size="21" font-weight="700" fill="#4A2A08" font-family="Noto Sans CJK KR, sans-serif">위비 꾸미기</text><text x="1560.0" y="365.0" text-anchor="middle" font-size="16" fill="#4A2A08" font-family="Noto Sans CJK KR, sans-serif">꿀머니로 스킨</text><path d="M 340 94.0 L 400 94.0" fill="none" stroke="#4A5568" stroke-width="2.4" marker-end="url(#a)"/><path d="M 700 94.0 L 760 94.0" fill="none" stroke="#4A5568" stroke-width="2.4" marker-end="url(#a)"/><path d="M 1080 94.0 L 1140 94.0" fill="none" stroke="#4A5568" stroke-width="2.4" marker-end="url(#a)"/><path d="M 280 344.0 L 320 344.0"