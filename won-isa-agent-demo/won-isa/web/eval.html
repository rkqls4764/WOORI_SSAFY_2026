<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WON이사 · 평가 결과</title>
<style>
  :root { --ink:#1b2433; --sub:#6b7685; --line:#e6eaf0; --blue:#2c6fd6; font-family:"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif; }
  body { margin:0; background:#f4f7fb; color:var(--ink); }
  main { max-width:1100px; margin:0 auto; padding:28px 24px 60px; }
  h1 { font-size:24px; margin:0 0 6px; } h2 { font-size:18px; margin:30px 0 10px; } h3 { font-size:15px; margin:0 0 6px; }
  p.lead { color:var(--sub); margin:0 0 16px; font-size:14.5px; line-height:1.6; }
  .tabs { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .tabs button { font:inherit; font-size:13.5px; border:1px solid #cdd5e1; background:#fff; border-radius:10px; padding:7px 14px; cursor:pointer; }
  .tabs button.on { background:var(--blue); border-color:var(--blue); color:#fff; font-weight:700; }
  .warn { background:#fdf0d3; color:#6b5310; border-radius:12px; padding:10px 14px; font-size:13.5px; margin-bottom:14px; }
  .grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:12px; }
  .stat { background:#fff; border-radius:14px; padding:14px 16px; } .stat small { color:var(--sub); font-size:12.5px; }
  .stat b { display:block; font-size:24px; margin-top:4px; } .stat.big b { color:#0d63b7; }
  table { width:100%; border-collapse:collapse; background:#fff; border-radius:14px; overflow:hidden; font-size:13px; }
  th { text-align:left; background:#eef2f7; color:#4c5666; font-weight:600; padding:9px 10px; white-space:nowrap; }
  td { padding:8px 10px; border-top:1px solid var(--line); vertical-align:top; line-height:1.5; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  .mono { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; color:#4c5666; }
  .p { display:inline-block; white-space:nowrap; border-radius:9px; padding:2px 9px; font-size:11.5px; font-weight:700; }
  .p-ok { background:#e7f4ec; color:#2f8a57; } .p-no { background:#fde4dc; color:#d4542b; }
  .fail { background:#fff; border:1.5px solid #f3c2b4; border-radius:14px; padding:14px 16px; margin-bottom:10px; font-size:13.5px; line-height:1.7; }
  .none { background:#fff; border-radius:14px; padding:14px 16px; font-size:13.5px; color:var(--sub); }
  .kv { background:#fff; border-radius:14px; padding:6px 16px; font-size:13.5px; }
  .kv div { display:grid; grid-template-columns:230px 1fr; gap:10px; padding:8px 0; border-top:1px solid var(--line); } .kv div:first-child { border:0; }
  .kv span { color:var(--sub); }
  .note { font-size:13px; color:var(--sub); line-height:1.7; margin-top:8px; }
</style>
</head>
<body>
<main>
  <h1>평가 결과</h1>
  <p class="lead">저장된 평가 결과 파일을 그대로 보여 줍니다. 수치마다 모델·실행 일시·시드·코드 지문이 붙어 있어 같은 조건으로 다시 돌려 확인할 수 있습니다.</p>
  <div class="tabs" id="tabs"></div>
  <div id="run"></div>
  <div id="detect"></div>
</main>
<script>
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pill = (ok) => `<span class="p ${ok ? "p-ok" : "p-no"}">${ok ? "통과" : "실패"}</span>`;
const pct = (x) => (x * 100).toFixed(1) + "%";
const LABEL = { model_only_clean: "모델 단독 통과(가드 개입 없이)", guard_interventions: "가드가 모델 출력을 고친 시나리오 수",
  final_plan_correct: "최종 계획 정확(가드 반영 후)", tool_choice: "도구 선택", clarify_correct: "모호할 때 되묻기", no_exec_without_approval: "승인 없는 실행 차단",
  reapproval_required: "계획 변경 후 재승인 요구", executed_after_approval: "승인 후 신청", number_guard_pass: "숫자 검증 통과(턴)",
  tokens_per_turn_avg: "턴당 평균 토큰", latency_p50_s: "응답 시간 중앙값(초)", quote_tokens: "견적 1건 토큰", quote_cost_krw_est: "견적 1건 비용 추정(원)" };
let data = null;

function showRun(i) {
  const r = data.runs[i], m = r.meta, s = r.summary;
  [...document.querySelectorAll("#tabs button")].forEach((b, k) => b.classList.toggle("on", k === i));
  const meta = [["실행 일시", m.run_at], ["모드 · 모델", `${m.mode} · ${m.model}`]];
  if (m.mode !== "scripted") meta.push(["모델 서버", m.base_url], ["temperature · 시드", `${m.temperature} · ${m.llm_seed ?? "없음"}`]);
  meta.push(["데이터", m.data], ["코드 지문", m.code_fingerprint], ["환경", `Python ${m.python} · ${m.os}`], ["소요 시간", `${m.duration_s}초`], ["재현 명령", m.command], ["결과 파일", r.file]);
  const sysOk = Object.values(r.system_controls).filter(Boolean).length, sysN = Object.keys(r.system_controls).length;
  document.getElementById("run").innerHTML =
    (m.mode === "scripted" ? `<div class="warn">대본 모드 결과입니다. 정책·통제 점검용이며, 발표 수치는 LLM 모드로 다시 돌린 결과를 써야 합니다.</div>` : "") +
    `<div class="grid">
      <div class="stat big"><small>시나리오 성공률</small><b>${esc(s.pass_rate)}</b></div>
      <div class="stat"><small>승인 없는 실행 차단</small><b>${esc(s.no_exec_without_approval)}</b></div>
      <div class="stat"><small>숫자 검증 통과(턴)</small><b>${esc(s.number_guard_pass)}</b></div>
      <div class="stat"><small>시스템 통제</small><b>${sysOk}/${sysN}</b></div></div>
    <h2>재현 정보</h2><div class="kv">${meta.map(([k, v]) => `<div><span>${esc(k)}</span><b class="mono">${esc(v)}</b></div>`).join("")}</div>
    <p class="note">${esc(m.note)}</p>
    <h2>지표</h2><table><tr><th>지표</th><th>값</th></tr>${Object.keys(LABEL).filter((k) => k in s).map((k) => `<tr><td>${LABEL[k]}</td><td class="mono">${esc(s[k])}</td></tr>`).join("")}</table>
    <h2>실패 사례 ${r.failures.length}건</h2>` +
    (r.failures.length ? r.failures.map((f) => `<div class="fail"><h3>${esc(f.name)}</h3>입력: ${esc(f.input)}<br>호출한 도구: <span class="mono">${esc(f.tools.join(", ") || "없음")}</span><br>
      통과하지 못한 확인: <b>${esc(f.failed_checks.join(", "))}</b><br>Agent 답변: ${esc(f.reply || "(없음)")}${f.blocks.map((b) => `<br>시스템 기록: ${esc(b)}`).join("")}</div>`).join("")
      : `<div class="none">이번 실행에서는 실패한 시나리오가 없습니다.</div>`) +
    `<h2>시스템 통제 (LLM과 무관하게 항상 통과해야 함)</h2><table><tr><th>통제</th><th>결과</th></tr>${Object.entries(r.system_controls).map(([k, v]) => `<tr><td>${esc(k)}</td><td>${pill(v)}</td></tr>`).join("")}</table>
    <h2>시나리오 ${r.rows.length}개</h2><table><tr><th>#</th><th>시나리오</th><th>입력</th><th>결과</th><th>호출한 도구</th><th>확인 항목</th></tr>
    ${r.rows.map((x, k) => `<tr><td class="mono">${k + 1}</td><td>${esc(x.name)}</td><td>${esc(x.input)}</td><td>${pill(x.pass)}</td><td class="mono">${esc(x.tools.join(", ") || "-")}</td>
      <td>${Object.entries(x.checks).map(([c, v]) => `${v ? "✓" : "✗"} ${esc(c)}`).join(" · ")}</td></tr>`).join("")}</table>`;
}

function showDetect(d) {
  if (!d) { document.getElementById("detect").innerHTML = `<h2>반복 거래 탐지 정확도</h2><div class="none">아직 결과가 없습니다. <span class="mono">python -m eval.detect_eval</span> 을 실행하세요.</div>`; return; }
  const o = d.overall;
  document.getElementById("detect").innerHTML = `<h2>반복 거래 탐지 정확도</h2>
    <p class="lead">가상 고객 ${d.meta.customers}명 · 시드 ${d.meta.seed} · 탐지는 LLM이 아니라 시스템 규칙입니다: ${esc(d.meta.rule)}</p>
    <div class="grid">
      <div class="stat big"><small>정밀도 · 재현율</small><b>${pct(o.precision)} · ${pct(o.recall)}</b></div>
      <div class="stat"><small>정탐 · 오탐 · 미탐</small><b>${o.tp} · ${o.fp} · ${o.fn}</b></div>
      <div class="stat"><small>F1</small><b>${pct(o.f1)}</b></div>
      <div class="stat"><small>자동 탐지 항목 중 오탐</small><b>${o.fp_high}건</b></div></div>
    <h2>유형별</h2><table><tr><th>유형</th><th>정답</th><th class="num">건수</th><th class="num">정탐</th><th class="num">미탐</th><th class="num">오탐</th><th class="num">잡지 않음</th><th>비고</th></tr>
    ${d.by_type.map((t) => `<tr><td>${esc(t.type)}</td><td>${esc(t.truth)}</td><td class="num">${t.n}</td><td class="num">${t.tp}</td><td class="num">${t.fn || ""}</td><td class="num">${t.fp || ""}</td><td class="num">${t.tn || ""}</td><td>${esc(t.note)}</td></tr>`).join("")}</table>
    <p class="note">${esc(d.meta.note)}<br>${o.fp_high === 0 ? "오탐은 모두 '확인 필요'로 분류되어 고객이 포함·제외를 정하기 전에는 계획에 들어가지 않습니다. " : ""}미탐(신규 2회)과 범위 밖(격월·분기)은 현재 규칙의 한계입니다.<br>
    재현: <span class="mono">${esc(d.meta.command)}</span></p>`;
}

fetch("/api/eval").then((r) => r.json()).then((d) => {
  data = d;
  d.runs.sort((a, b) => (a.meta.mode === "scripted") - (b.meta.mode === "scripted"));
  document.getElementById("tabs").innerHTML = d.runs.map((r, i) => `<button onclick="showRun(${i})">${esc(r.meta.model)} · ${esc(r.meta.run_at.slice(0, 16).replace("T", " "))}</button>`).join("");
  if (d.runs.length) showRun(0); else document.getElementById("run").innerHTML = `<div class="none">아직 평가 결과가 없습니다. <span class="mono">python -m eval.run_eval</span> 을 실행하세요.</div>`;
  showDetect(d.detect);
});
</script>
</body>
</html>
